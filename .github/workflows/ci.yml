name: CI

on:
  push:
  pull_request:

jobs:
  rust-check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check native workspace
        run: cargo check --workspace --all-targets
      - name: Check frontend wasm
        run: cargo check --manifest-path crates/note-frontend/Cargo.toml --target wasm32-unknown-unknown
