name: CI

on:
  push:
  pull_request:

jobs:
  rust-check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check native workspace
        run: cargo check --workspace --all-targets
      - name: Check frontend wasm
        run: cargo check --manifest-path crates/note-frontend/Cargo.toml --target wasm32-unknown-unknown

  postgres-storage:
    name: PostgreSQL storage contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Turso storage suite
        run: cargo test -p note-storage-turso
      - name: Run PostgreSQL storage suite
        run: cargo test -p note-storage-pg

  s3-integration:
    name: S3 integration (MinIO)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
      NOTE_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      NOTE_TEST_MINIO_BUCKET: agent-note-tests

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name agent-note-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-18T21-56-31Z server /data
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs agent-note-minio
            exit 1
          fi
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc:RELEASE.2025-07-21T05-28-08Z \
            mb --ignore-existing local/agent-note-tests
      - name: Test S3 attachment adapter
        run: cargo test --locked -p note-attachments --test s3_minio_test -- --nocapture
      - name: Test S3 import and export
        run: cargo test --locked -p note-pipelines --test s3_export_test -- --nocapture
      - name: Print MinIO logs on failure
        if: failure()
        run: docker logs agent-note-minio
