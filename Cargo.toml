[workspace]
resolver = "2"
members = [
    "crates/note-core",
    "crates/note-storage",
    "crates/note-storage-turso",
    "crates/note-embedding",
    "crates/note-pipelines",
    "crates/note-mcp",
    "crates/note-server",
]
exclude = ["crates/note-frontend"]

[workspace.package]
edition = "2021"
