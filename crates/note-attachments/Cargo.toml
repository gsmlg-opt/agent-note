[package]
name = "note-attachments"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = "=1.13.0"
aws-sdk-s3 = "=1.153.0"
base16ct = { version = "1.0.0", features = ["alloc"] }
libc = "0.2"
note-core = { version = "0.1.0", path = "../note-core" }
sha2 = "0.11"
tokio = { version = "1.54.0", features = ["fs", "io-util", "rt", "sync"] }
url = "2"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt", "time"] }
wiremock = "0.6.5"
