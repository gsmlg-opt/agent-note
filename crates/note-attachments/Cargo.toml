[package]
name = "note-attachments"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
aws-config = "=1.9.0"
aws-sdk-s3 = "=1.138.1"
libc = "0.2"
note-core = { version = "0.1.0", path = "../note-core" }
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt", "sync"] }
url = "2"
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }
wiremock = "0.6.5"
