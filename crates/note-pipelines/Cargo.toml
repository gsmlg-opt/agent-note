[package]
name = "note-pipelines"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
note-core = { version = "0.1.0", path = "../note-core" }
note-embedding = { version = "0.1.0", path = "../note-embedding" }
note-storage = { version = "0.1.0", path = "../note-storage" }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
libsql = "0.9.30"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
