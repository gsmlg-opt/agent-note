[package]
name = "note-pipelines"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
flate2 = "1.1.5"
note-core = { version = "0.1.0", path = "../note-core" }
note-embedding = { version = "0.1.0", path = "../note-embedding" }
note-storage = { version = "0.1.0", path = "../note-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
text-splitter = { version = "0.32.0", features = ["markdown"] }
tar = "0.4.44"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.89"
note-storage-turso = { version = "0.1.0", path = "../note-storage-turso" }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
