[package]
name = "note-pipelines"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
base16ct = { version = "1.0.0", features = ["alloc"] }
base64 = "0.23.1"
chrono = "0.4.45"
flate2 = "1.1.10"
getrandom = "0.4.3"
hmac = "0.13"
note-attachments = { version = "0.1.0", path = "../note-attachments" }
note-core = { version = "0.1.0", path = "../note-core" }
note-embedding = { version = "0.1.0", path = "../note-embedding" }
note-org = { version = "0.1.0", path = "../note-org" }
note-storage = { version = "0.1.0", path = "../note-storage" }
html5ever = "0.39"
percent-encoding = "2.3"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
text-splitter = { version = "0.33.0", features = ["markdown"] }
tar = "0.4.46"
tokio = { version = "1.54.0", features = ["rt"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
note-storage-turso = { version = "0.1.0", path = "../note-storage-turso" }
note-storage-pg = { version = "0.1.0", path = "../note-storage-pg" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }
url = "2"
