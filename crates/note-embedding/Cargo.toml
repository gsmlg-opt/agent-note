[package]
name = "note-embedding"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3"
interprocess = { version = "2.4.6", features = ["tokio"] }
num_cpus = "1.17"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
# default-features disabled + load-dynamic: this ort version has no prebuilt ONNX Runtime binary
# for x86_64-apple-darwin, so build-time download/linking (the default) fails here; load-dynamic
# instead loads the ONNX Runtime shared library at runtime (e.g. via ORT_DYLIB_PATH), which also
# fits this app's "manually download the model" flow. api-24 pins the OrtApi version load-dynamic
# needs (dropping default-features drops this gate too, so it must be re-added explicitly).
# Keep api-24 aligned with the ONNX Runtime 1.24.x shared library bundled in Dockerfile.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "api-24"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tarpc = { version = "0.38.0", features = ["serde1", "tokio1", "serde-transport", "serde-transport-bincode"] }
# BoundedEmbedder uses tokio::sync::Semaphore in production code (not just tests), so tokio is a
# regular dependency, not dev-only.
tokio = { version = "1.54.0", features = ["full"] }

[dev-dependencies]
# Match tarpc's tokio-serde Bincode codec, which still uses bincode 1.
bincode = "1.3"
tempfile = "3.27.0"
wiremock = "0.6.5"
