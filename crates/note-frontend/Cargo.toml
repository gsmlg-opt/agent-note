[package]
name = "note-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement"] }
gloo-net = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen-futures = "0.4.76"
yew-duskmoon = "0.6.1"
yew-router = "0.20.0"
