[package]
name = "note-frontend"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
base64 = "0.23.1"
yew = { version = "0.23.0", features = ["csr"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = [
    "AbortController",
    "AbortSignal",
    "Clipboard",
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Node",
    "NodeList",
    "Window",
] }
gloo-net = "0.7.0"
gloo-file = { version = "0.4.0", features = ["futures"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
pulldown-cmark = "0.13.6"
pulldown-cmark-to-cmark = "23.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4", "js"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
yew-duskmoon = "0.11.2"
yew-router = "0.20.0"
note-core = { path = "../note-core" }
note-org = { path = "../note-org" }
