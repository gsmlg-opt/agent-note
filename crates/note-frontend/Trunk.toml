[build]
target = "index.html"

# Serve the frontend on a different port than note-server (which binds 127.0.0.1:8080), then
# forward API + MCP calls to it so the frontend's same-origin relative URLs (/api/..., /mcp) work
# in dev without CORS. Run `note-server` first, then `trunk serve` in this crate.
[serve]
port = 8081

[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:8080/api/"

[[proxy]]
rewrite = "/mcp"
backend = "http://127.0.0.1:8080/mcp"
