[package]
name = "note-mcp"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
note-core = { version = "0.1.0", path = "../note-core" }
note-pipelines = { version = "0.1.0", path = "../note-pipelines" }
rmcp = { version = "2.0.0", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-std", "rt", "macros"] }

[dev-dependencies]
note-attachments = { path = "../note-attachments" }
note-embedding = { path = "../note-embedding" }
note-storage = { path = "../note-storage" }
note-storage-turso = { path = "../note-storage-turso" }
rmcp = { version = "2.0.0", features = ["client", "transport-io"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
