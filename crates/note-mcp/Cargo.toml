[package]
name = "note-mcp"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
note-pipelines = { version = "0.1.0", path = "../note-pipelines" }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
note-embedding = { path = "../note-embedding" }
note-storage = { path = "../note-storage" }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
