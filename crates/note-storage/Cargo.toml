[package]
name = "note-storage"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
libsql = "0.9.30"
note-core = { version = "0.1.0", path = "../note-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
