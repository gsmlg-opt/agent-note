[package]
name = "note-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
note-pipelines = { path = "../note-pipelines" }
note-mcp = { path = "../note-mcp" }
note-attachments = { path = "../note-attachments" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
note-core = { path = "../note-core" }
note-embedding = { version = "0.1.0", path = "../note-embedding" }
note-storage = { version = "0.1.0", path = "../note-storage" }
note-storage-pg = { version = "0.1.0", path = "../note-storage-pg" }
note-storage-turso = { version = "0.1.0", path = "../note-storage-turso" }
anyhow = "1.0.103"
async-trait = "0.1.89"
chrono = "0.4.45"
toml = "0.8.23"
toml_edit = "0.22.27"
tempfile = "3.27.0"
tower-http = { version = "0.7.0", features = ["fs"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
yew-duskmoon = "0.8.1"

[dev-dependencies]
flate2 = "1.1.5"
http-body-util = "0.1.3"
tar = "0.4.44"
tarpc = { version = "0.37.0", features = ["serde1", "tokio1", "serde-transport", "serde-transport-bincode"] }
tower = "0.5.3"
wiremock = "0.6.5"
