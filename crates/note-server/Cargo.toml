[package]
name = "note-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
note-pipelines = { path = "../note-pipelines" }
note-mcp = { path = "../note-mcp" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
note-core = { path = "../note-core" }
note-embedding = { version = "0.1.0", path = "../note-embedding" }
note-storage = { version = "0.1.0", path = "../note-storage" }
anyhow = "1.0.103"
tower-http = { version = "0.7.0", features = ["fs"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tarpc = { version = "0.37.0", features = ["serde1", "tokio1", "serde-transport", "serde-transport-bincode"] }
tower = "0.5.3"
