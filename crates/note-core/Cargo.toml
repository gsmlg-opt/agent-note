[package]
name = "note-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
urlencoding = "2.1.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
agcodex-apply-patch = "0.1.0"
aho-corasick = "1.1.5"

[dev-dependencies]
serde_json = "1.0.154"
