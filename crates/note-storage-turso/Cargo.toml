[package]
name = "note-storage-turso"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
note-core = { version = "0.1.0", path = "../note-core" }
note-org = { version = "0.1.0", path = "../note-org" }
note-storage = { version = "0.1.0", path = "../note-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt"] }
turso = "0.8.3"

[dev-dependencies]
note-storage-contract-tests = { path = "../note-storage-contract-tests" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }
